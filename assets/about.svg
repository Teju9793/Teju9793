<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace">
<defs>
<linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF"/><stop offset="1" stop-color="#A371F7"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="#161B22" stroke="#30363D"/>
<rect width="1200" height="46" rx="18" fill="#0D1117"/>
<rect y="30" width="1200" height="16" fill="#0D1117"/>
<circle cx="30" cy="23" r="6" fill="#FF7B72"/>
<circle cx="52" cy="23" r="6" fill="#D29922"/>
<circle cx="74" cy="23" r="6" fill="#3FB950"/>
<text x="600" y="28" text-anchor="middle" font-size="14" fill="#8B949E">about.json</text>
<text x="50" y="92" font-size="20" fill="#E6EDF3" opacity="0"><tspan fill="#58A6FF">$</tspan> cat about.json<animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.35s" fill="freeze"/></text>
<text x="50" y="128" font-size="20" fill="#8B949E" opacity="0">{<animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.35s" fill="freeze"/></text>
<text x="76" y="164" font-size="20" fill="#E6EDF3" opacity="0"><tspan fill="#58A6FF">"focus"</tspan><tspan fill="#8B949E">:</tspan> "Full-stack development | Android | Data Science",<animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.35s" fill="freeze"/></text>
<text x="76" y="200" font-size="20" fill="#E6EDF3" opacity="0"><tspan fill="#58A6FF">"education"</tspan><tspan fill="#8B949E">:</tspan> "B.E. CSE (Data Science) | SSIT Tumkur",<animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.35s" fill="freeze"/></text>
<text x="76" y="236" font-size="20" fill="#E6EDF3" opacity="0"><tspan fill="#58A6FF">"experience"</tspan><tspan fill="#8B949E">:</tspan> "AI Web Development Intern | InAmigos Foundation",<animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.35s" fill="freeze"/></text>
<text x="76" y="272" font-size="20" fill="#E6EDF3" opacity="0"><tspan fill="#58A6FF">"leadership"</tspan><tspan fill="#8B949E">:</tspan> "Founder &amp; Technical Lead | NEXOVA"<animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.35s" fill="freeze"/></text>
<text x="50" y="308" font-size="20" fill="#8B949E" opacity="0">}<animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.35s" fill="freeze"/></text>
<rect x="76" y="326" width="12" height="20" fill="url(#accent)" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
